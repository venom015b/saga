<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="t d">
  <title id="t">Sample: weekly availability of one app, eight weeks</title>
  <desc id="d">Bar chart of made-up weekly availability percentages, all between 99.2 and 100 percent. Sample data only.</desc>
  <style>
    .bg { fill: #ffffff; }
    .tx { fill: #1a1a1a; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .ax { stroke: #595959; stroke-width: 1; }
    .gr { stroke: #d0d0d0; stroke-width: 1; }
    .bar { fill: #2a6fb5; }
    .tag { fill: #fff3cd; stroke: #7a5b00; }
    .tagt { fill: #4d3a00; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #14161a; }
      .tx { fill: #e8e8e8; }
      .ax { stroke: #a8a8a8; }
      .gr { stroke: #3a3d44; }
      .bar { fill: #6ea8e8; }
      .tag { fill: #3a2f08; stroke: #e0c26a; }
      .tagt { fill: #f3dc92; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="640" height="360"/>
  <text class="tx" x="320" y="28" font-size="18" font-weight="600" text-anchor="middle">Weekly availability of one app (Sample)</text>
  <rect class="tag" x="548" y="40" width="72" height="24" rx="4"/>
  <text class="tagt" x="584" y="57" font-size="13" font-weight="600" text-anchor="middle" font-family="system-ui, sans-serif">Sample</text>

  <line class="gr" x1="70" y1="80" x2="610" y2="80"/>
  <line class="gr" x1="70" y1="130" x2="610" y2="130"/>
  <line class="gr" x1="70" y1="180" x2="610" y2="180"/>
  <line class="gr" x1="70" y1="230" x2="610" y2="230"/>
  <line class="gr" x1="70" y1="280" x2="610" y2="280"/>

  <text class="tx" font-size="12" x="62" y="84" text-anchor="end">100</text>
  <text class="tx" font-size="12" x="62" y="134" text-anchor="end">99.8</text>
  <text class="tx" font-size="12" x="62" y="184" text-anchor="end">99.6</text>
  <text class="tx" font-size="12" x="62" y="234" text-anchor="end">99.4</text>
  <text class="tx" font-size="12" x="62" y="284" text-anchor="end">99.2</text>

  <!-- 250px = 0.8 percentage points, so 62.5px per 0.2; baseline y=280 is 99.2 -->
  <rect class="bar" x="82"  y="80"  width="44" height="200"/>
  <rect class="bar" x="149" y="105" width="44" height="175"/>
  <rect class="bar" x="216" y="80"  width="44" height="200"/>
  <rect class="bar" x="283" y="140" width="44" height="140"/>
  <rect class="bar" x="350" y="80"  width="44" height="200"/>
  <rect class="bar" x="417" y="80"  width="44" height="200"/>
  <rect class="bar" x="484" y="115" width="44" height="165"/>
  <rect class="bar" x="551" y="80"  width="44" height="200"/>

  <line class="ax" x1="70" y1="280" x2="610" y2="280"/>
  <line class="ax" x1="70" y1="80" x2="70" y2="280"/>

  <text class="tx" font-size="12" x="104" y="298" text-anchor="middle">1</text>
  <text class="tx" font-size="12" x="171" y="298" text-anchor="middle">2</text>
  <text class="tx" font-size="12" x="238" y="298" text-anchor="middle">3</text>
  <text class="tx" font-size="12" x="305" y="298" text-anchor="middle">4</text>
  <text class="tx" font-size="12" x="372" y="298" text-anchor="middle">5</text>
  <text class="tx" font-size="12" x="439" y="298" text-anchor="middle">6</text>
  <text class="tx" font-size="12" x="506" y="298" text-anchor="middle">7</text>
  <text class="tx" font-size="12" x="573" y="298" text-anchor="middle">8</text>

  <text class="tx" font-size="13" x="340" y="326" text-anchor="middle">Week number</text>
  <text class="tx" font-size="13" text-anchor="middle" transform="translate(18 180) rotate(-90)">Availability (% of the week)</text>
  <text class="tx" font-size="11" x="340" y="348" text-anchor="middle">Made-up data for illustration. Replace with your own chart.</text>
</svg>
